# =============================================================================
# Payroll module schemas
# =============================================================================

BaseSalaryResponse:
  type: object
  required:
    - id
    - employee_id
    - amount
    - currency
    - effective_date
    - notes
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    employee_id:
      type: string
      format: uuid
    amount:
      type: number
      format: float
      description: Base salary amount
    currency:
      type: string
      description: ISO 4217 currency code
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true

# ---------------------------------------------------------------------------
# Setup (bulk upsert)
# ---------------------------------------------------------------------------

SetupEmployeePayrollBaseSalary:
  type: object
  properties:
    amount:
      type: number
      minimum: 0
    currency:
      type: string
      default: IDR
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true
    notes:
      type: string

SetupEmployeePayrollItem:
  type: object
  properties:
    compensation_item_id:
      type: string
      format: uuid
    benefit_type_id:
      type: string
      format: uuid
    deduction_type_id:
      type: string
      format: uuid
    participant_number:
      type: string
    amount:
      type: number
      minimum: 0
    frequency:
      type: string
      description: How often the allowance is paid. Says nothing about how the amount is derived.
      enum: [monthly, yearly, one_time]
    calc_type:
      type: string
      description: >-
        How the allowance is derived. `fixed` pays amount once per period; `per_attended_day`
        treats amount as a daily rate and multiplies it by days actually present.
        Defaults to `fixed` when omitted.
      enum: [fixed, per_attended_day]
    unit_amount:
      type: number
      nullable: true
      minimum: 0
      description: >-
        Per-employee daily rate for a `per_day` deduction, in major units. Set it to pin the
        rate at a flat amount even when the deduction type derives from `daily_wage`; omit it
        to inherit the type default. `0` disables the deduction for this employee.
    value:
      type: number
      nullable: true
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true

SetupEmployeePayrollRequest:
  type: object
  required:
    - employee_id
  properties:
    employee_id:
      type: string
      format: uuid
    base_salary:
      $ref: "#/SetupEmployeePayrollBaseSalary"
    compensations:
      type: array
      items:
        $ref: "#/SetupEmployeePayrollItem"
    benefits:
      type: array
      items:
        $ref: "#/SetupEmployeePayrollItem"
    deductions:
      type: array
      items:
        $ref: "#/SetupEmployeePayrollItem"
      description: Null if currently active
    notes:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateBaseSalaryRequest:
  type: object
  required:
    - employee_id
    - amount
    - effective_date
  properties:
    employee_id:
      type: string
      format: uuid
    amount:
      type: number
      minimum: 0
    currency:
      type: string
      default: IDR
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true
    notes:
      type: string

UpdateBaseSalaryRequest:
  type: object
  required:
    - amount
    - effective_date
  properties:
    amount:
      type: number
      minimum: 0
    currency:
      type: string
      default: IDR
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true
    notes:
      type: string

