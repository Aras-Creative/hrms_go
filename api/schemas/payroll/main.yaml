# ---------------------------------------------------------------------------
# Deduction Types
# ---------------------------------------------------------------------------

DeductionTypeResponse:
  type: object
  required:
    - id
    - name
    - slug
    - deduction_type
    - default_value
    - is_active
    - is_mandatory
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    description:
      type: string
    deduction_type:
      type: string
      enum: [percentage, fixed, per_day]
    default_value:
      type: number
      format: float
    value_source:
      type: string
      enum: [fixed, daily_wage]
      description: >-
        Where the daily rate of a per_day deduction comes from. `fixed` uses
        `unit_amount`; `daily_wage` derives base_salary / working_days.
    unit_amount:
      type: number
      description: >-
        Flat amount in rupiah for one day when deduction_type is `per_day` and
        value_source is `fixed`. Employees can override it per assignment to pin a flat
        rate even when this type derives from `daily_wage`.
    is_active:
      type: boolean
    is_mandatory:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateDeductionTypeRequest:
  type: object
  required:
    - name
    - deduction_type
    - default_value
  properties:
    name:
      type: string
      maxLength: 255
    description:
      type: string
    deduction_type:
      type: string
      enum: [percentage, fixed, per_day]
    default_value:
      type: number
      minimum: 0
    value_source:
      type: string
      enum: [fixed, daily_wage]
      default: fixed
      description: Only used when deduction_type is `per_day`.
    unit_amount:
      type: number
      minimum: 0
      description: >-
        Required and greater than 0 when deduction_type is `per_day` and
        value_source is `fixed`.
    is_mandatory:
      type: boolean
      default: false

UpdateDeductionTypeRequest:
  type: object
  required:
    - name
    - deduction_type
    - default_value
  properties:
    name:
      type: string
      maxLength: 255
    description:
      type: string
    deduction_type:
      type: string
      enum: [percentage, fixed, per_day]
    default_value:
      type: number
      minimum: 0
    value_source:
      type: string
      enum: [fixed, daily_wage]
      default: fixed
    unit_amount:
      type: number
      minimum: 0
    is_active:
      type: boolean
    is_mandatory:
      type: boolean

# ---------------------------------------------------------------------------
# Employee Deductions
# ---------------------------------------------------------------------------

EmployeeDeductionResponse:
  type: object
  required:
    - id
    - employee_id
    - deduction_type_id
    - deduction_type
    - deduction_type_name
    - value_source
    - effective_date
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    employee_id:
      type: string
      format: uuid
    deduction_type_id:
      type: string
      format: uuid
    deduction_type:
      type: string
      enum: [percentage, fixed, per_day]
      description: >-
        Basis copied from the deduction type. Present so a client can decide which input
        to render without fetching every deduction type: show the percentage or flat
        amount for `percentage`/`fixed`, and only the daily rate for `per_day`.
    deduction_type_name:
      type: string
      description: Name of the deduction type, so labels match the payslip breakdown.
    value_source:
      type: string
      enum: [fixed, daily_wage]
      description: >-
        How the deduction type derives its rate. Only meaningful when deduction_type is
        `per_day`.
    value:
      type: number
      format: float
      nullable: true
      description: >-
        Null if using the default from deduction_type. Ignored by the calculation when
        deduction_type is `per_day`.
    unit_amount:
      type: number
      nullable: true
      description: >-
        Per-employee daily rate in major units, overriding deduction_types.unit_amount.
        Only meaningful when deduction_type is `per_day`; null falls back to the type,
        while 0 pins the rate at zero and disables the charge for this employee.
    effective_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

